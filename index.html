<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: media:; media-src media:">
<title>AKU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="svg-sprite" aria-hidden="true">
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
  <symbol id="icon-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
  <symbol id="icon-next" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></symbol>
  <symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="M10.6 7.3L8.5 5.1A5 5 0 0 0 5 3.7H3v2h2c.9 0 1.8.4 2.4 1.1l2.2 2.2zM14.5 13.1l-2.1 2.1 2.1 2.2c.7.7 1.6 1.1 2.5 1.1h1v-2h-1c-.4 0-.7-.2-1-.5zM21 7.7h-3.9c-1 0-1.9.4-2.6 1.1l-6.8 6.8c-.6.6-1.5 1-2.4 1H3v-2h2.3c.4 0 .7-.1 1-.4l6.8-6.8a5 5 0 0 1 2.7-1.7H21zM21 14.7h-3.9c-.5 0-.9-.2-1.3-.5l-1.4-1.4-1.4 1.4 1.4 1.4a5 5 0 0 0 2.7 1.1H21z"/></symbol>
  <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
  <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></symbol>
  <symbol id="icon-mini" viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></symbol>
  <symbol id="icon-genre" viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></symbol>
  <symbol id="icon-categorize" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></symbol>
  <symbol id="icon-queue" viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm12-1l6-3.5-6-3.5z"/></symbol>
  <symbol id="icon-builder" viewBox="0 0 24 24"><path d="M11 2l1.7 4.5L17 8l-4.3 1.5L11 14l-1.7-4.5L5 8l4.3-1.5zM6 15l1.1 2.9L10 19l-2.9 1.1L6 23l-1.1-2.9L2 19l2.9-1.1z"/></symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></symbol>
</svg>

<div id="app">
  <div id="sidebar-handle" title="Show sidebar"></div>
  <aside id="sidebar">
    <div class="brand">AKU</div>
    <nav>
      <button class="nav-item" data-view="library">Library</button>
      <button class="nav-item" data-view="favorites">Favorites</button>
      <button class="nav-item" data-view="albums">Albums</button>
      <button class="nav-item" data-view="artists">Artists</button>
      <button class="nav-item" data-view="genres">Genres</button>
      <button class="nav-item" data-view="eras">Eras</button>
    </nav>
    <div class="playlists-header">
      <span>Playlists</span>
      <div class="playlists-actions">
        <button id="playlist-builder" class="icon-btn" title="Playlist builder"><svg><use href="#icon-builder"/></svg></button>
        <button id="categorize-btn" class="icon-btn" title="Find genres by artist and title"><svg><use href="#icon-categorize"/></svg></button>
        <button id="genre-maker" class="icon-btn" title="Make playlists by genre"><svg><use href="#icon-genre"/></svg></button>
        <button id="new-playlist" class="icon-btn" title="New playlist">+</button>
      </div>
    </div>
    <div id="new-playlist-row" class="hidden">
      <input id="new-playlist-input" type="text" placeholder="Playlist name" maxlength="40">
    </div>
    <ul id="playlist-list"></ul>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar"><svg><use href="#icon-menu"/></svg></button>
      <h1 id="view-title">Library</h1>
      <input id="search" type="search" placeholder="Search title, artist, album">
      <button id="settings-btn" class="icon-btn" title="Settings"><svg><use href="#icon-settings"/></svg></button>
      <button id="choose-folder" class="accent-btn">Add music</button>
    </header>
    <div id="status"></div>
    <div id="track-list"></div>
    <div id="sel-bar" class="hidden"></div>
  </main>
</div>

<footer id="player">
  <div id="now-playing">
    <div id="now-cover" class="cover"><span>&#9834;</span></div>
    <div id="now-meta">
      <div id="now-title">Nothing playing</div>
      <div id="now-artist"></div>
    </div>
  </div>
  <button id="quality-btn" class="quality-btn" title="Audio quality">&#8212;</button>
  <button id="queue-btn" class="icon-btn" title="Queue"><svg><use href="#icon-queue"/></svg></button>
  <button id="mini-btn" class="icon-btn" title="Mini player"><svg><use href="#icon-mini"/></svg></button>
  <div id="controls">
    <div id="control-buttons">
      <button id="shuffle-btn" class="icon-btn" title="Shuffle"><svg><use href="#icon-shuffle"/></svg></button>
      <button id="prev-btn" class="icon-btn" title="Previous"><svg><use href="#icon-prev"/></svg></button>
      <button id="play-btn" class="icon-btn play" title="Play / Pause"><svg><use id="play-icon" href="#icon-play"/></svg></button>
      <button id="next-btn" class="icon-btn" title="Next"><svg><use href="#icon-next"/></svg></button>
      <button id="repeat-btn" class="icon-btn" title="Repeat"><svg><use href="#icon-repeat"/></svg><span id="repeat-one" class="hidden">1</span></button>
    </div>
    <div id="seek-row">
      <span id="time-current">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="time-total">0:00</span>
    </div>
  </div>
  <div id="volume-row">
    <svg class="volume-icon"><use href="#icon-volume"/></svg>
    <input id="volume" type="range" min="0" max="100" value="80">
  </div>
</footer>

<div id="row-menu" class="hidden"></div>
<div id="add-menu" class="hidden"></div>
<div id="quality-popover" class="hidden"></div>
<div id="genre-popover" class="hidden"></div>
<aside id="queue-panel" class="hidden">
  <header id="queue-header">
    <span>Queue</span>
    <button id="queue-close" class="icon-btn" title="Close">&#10005;</button>
  </header>
  <div id="queue-list"></div>
</aside>
<div id="settings-overlay" class="hidden">
  <div id="settings-panel" role="dialog" aria-label="Settings">
    <header id="settings-header">
      <span>Settings</span>
      <button id="settings-close" class="icon-btn" title="Close">&#10005;</button>
    </header>
    <div id="settings-body"></div>
  </div>
</div>
<div id="builder-overlay" class="hidden">
  <div id="builder-panel" role="dialog" aria-label="Playlist builder">
    <header id="builder-header">
      <span id="builder-title">Playlist builder</span>
      <div class="builder-header-actions">
        <button id="builder-save" class="accent-btn">Save playlist</button>
        <button id="builder-close" class="icon-btn" title="Close">&#10005;</button>
      </div>
    </header>
    <div id="builder-body"></div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
